name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Verify dist artifacts
        run: |
          test -s dist/drawflow.min.js || { echo "dist/drawflow.min.js missing or empty"; exit 1; }
          test -s dist/drawflow.min.css || { echo "dist/drawflow.min.css missing or empty"; exit 1; }
          test -s dist/drawflow.style.js || { echo "dist/drawflow.style.js missing or empty"; exit 1; }
          echo "All dist artifacts present"
